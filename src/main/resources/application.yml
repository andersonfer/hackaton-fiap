spring:
  application:
    name: fiapx-video-processor
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fiapx?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:fiapx}
    password: ${SPRING_DATASOURCE_PASSWORD:fiapx123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:fiapx}
    password: ${SPRING_RABBITMQ_PASSWORD:fiapx123}

server:
  port: 8080

app:
  armazenamento:
    diretorio-videos: ${DIRETORIO_VIDEOS:/tmp/fiapx/videos}
    diretorio-frames: ${DIRETORIO_FRAMES:/tmp/fiapx/frames}
    diretorio-zips: ${DIRETORIO_ZIPS:/tmp/fiapx/zips}
  mensageria:
    fila-processamento: fila.video.processamento
    concorrencia: 1
  reprocessamento:
    intervalo-ms: 60000
    timeout-minutos: 5
  jwt:
    segredo: ${JWT_SEGREDO:chave-secreta-fiapx-video-processor-muito-segura-32chars}
    expiracao-ms: ${JWT_EXPIRACAO_MS:86400000}

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

app:
  armazenamento:
    diretorio-videos: /tmp/fiapx-test/videos
    diretorio-frames: /tmp/fiapx-test/frames
    diretorio-zips: /tmp/fiapx-test/zips
  mensageria:
    habilitado: false
    fila-processamento: fila.video.processamento.test
    concorrencia: 1
